[package]
name = "cw"
version = "0.1.0"
edition = "2021"   # `cargo init` on rustc 1.95 defaults to 2024 — scaffold agent must explicitly set this, not assume it (Opus-audit-caught, F39)
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"               # NOT 0.8 — that's three majors stale; current is 1.x (Opus-audit-caught, F20). Starting stale means Dependabot opens a major-bump PR in week one against a brand-new ruleset, which is exactly the CI-thrash §0 rules out.
anyhow = "1"
git2 = { version = "0.21", features = ["https"] }
  # git2 0.21's own `default = []` (verified against its Cargo.toml this
  # session — NOT the "default features (ssh+https)" this comment used to
  # assume); `https` is what registers the https:// transport at all and
  # pulls in `cred` (§5b's `Cred::credential_helper`), and on macOS the
  # *TLS backend libgit2 actually compiles in* is Secure Transport, not
  # OpenSSL (libgit2-sys's build.rs selects GIT_OPENSSL only for non-Apple
  # unix targets, unconditionally on `target.contains("apple")` — verified
  # against its build.rs this session, unaffected by any openssl feature
  # flag). `ssh` deliberately left off: §0 locks `git_protocol=https`,
  # cloning goes through `gh repo clone`, and the credential path is `gh
  # auth git-credential` for `https://github.com` — nothing in this design
  # uses an ssh remote, so there's no reason to widen the license/link
  # surface for it.
  #
  # BUT: unlike git2's own optional openssl-sys dep (scoped to
  # `cfg(all(unix, not(target_os = "macos")))` in git2's Cargo.toml),
  # libgit2-sys's `https = ["openssl-sys"]` is NOT scoped away from macOS —
  # it requires openssl-sys on all `cfg(unix)` — because `openssl_init()`
  # (`#[cfg(all(unix, feature = "https"))] pub fn openssl_init() {
  # openssl_sys::init(); }` in libgit2-sys's lib.rs) calls it unconditionally
  # on every unix target regardless of which TLS backend is actually
  # compiled in. That's a real, observed macOS defect, not a theoretical
  # one: `otool -L target/debug/cw` showed the built binary dynamically
  # linked against `/opt/homebrew/opt/openssl@3/lib/{libssl,libcrypto}.3.dylib`
  # by absolute Homebrew path — despite Secure Transport doing the actual
  # TLS work — so the binary breaks the moment that install is upgraded,
  # relocated, or missing. Fixed below via a macOS-scoped `vendored`
  # openssl-sys, confirmed by re-running otool: Security.framework (Secure
  # Transport) is still linked, the Homebrew dylib path is gone. See §0 re:
  # vendored-openssl on Linux — that's a separate, still-unresolved
  # question (system-openssl-missing contingency); this macOS fix is
  # narrower and doesn't touch it.
skim = { version = "=5.6.5", default-features = false, features = ["frizbee"] }
  # Exact pin — API churns fast across majors. Non-default features (Opus-audit-caught, F21):
  # skim's *default* feature set pulls in a whole CLI stack cw never uses — clap_mangen,
  # clap_complete_nushell, env_logger, image, ratatui-image, ron — on top of mandatory deps
  # (tokio, portable-pty, ratatui, nix, mimalloc, which, shell-quote, roff). That inflates
  # build time and blows past deny.toml's license allowlist (§9). `frizbee` is skim's fuzzy-
  # match backend and the only default feature cw actually needs. Verify this trims correctly
  # in the §6 step 2 spike — if `frizbee` alone doesn't build/behave right, fall back to full
  # defaults and widen deny.toml's allowlist instead of fighting it further.
ignore = "0.4"           # GitignoreBuilder for .worktreeinclude — same crate ripgrep uses, don't hand-roll
chrono = { version = "0.4", features = ["serde"] }
  # `features = ["serde"]` is required, not optional (Opus-audit-caught, F8) — RepoCache{fetched_at:
  # DateTime<Utc>, ..} is serde_json-serialized in §5k; DateTime only implements Serialize/Deserialize
  # behind this feature flag. Without it, cache.rs doesn't compile.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"  # persists a copy of the run's log to ~/.cache/cw/cw.log — see §5m
clap_complete = "4"      # `cw completions <shell>` — see §4

[target.'cfg(target_os = "linux")'.dependencies]
# Only uncommented if the §6 Linux Docker build spike fails to link against system OpenSSL:
# openssl-sys = { version = "0.9", features = ["vendored"] }
  # `openssl-sys` directly, not `git2 = {features=["vendored-openssl"]}` a second time in this
  # table — Cargo unions feature flags across duplicate dependency entries, so either form works,
  # but pulling in openssl-sys directly is the more conventional way to express this (minor, F27).

[target.'cfg(target_os = "macos")'.dependencies]
# Vendor (statically link) OpenSSL on macOS too — not for TLS (Secure
# Transport handles that, unaffected by this flag; see the git2 dependency
# comment above) but because libgit2-sys's `https` feature otherwise leaves
# an unused-but-required openssl-sys dynamically linked against Homebrew's
# `openssl@3` by absolute path, which breaks on any Mac where that install
# differs or is missing. Same crate/feature/rationale as the Linux
# contingency above, different trigger.
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
