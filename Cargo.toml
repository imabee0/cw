[package]
name = "cw"
version = "0.1.14"
edition = "2021"   # `cargo init` on rustc 1.95 defaults to 2024 — scaffold agent must explicitly set this, not assume it (Opus-audit-caught, F39)
license = "MIT"
repository = "https://github.com/imabee0/cw"
homepage = "https://github.com/imabee0/cw"
readme = "README.md"
description = "Fuzzy-pick a GitHub repo, clone/pull it, create-or-resume a git worktree, launch an agent CLI inside it."
keywords = ["cli", "git", "worktree", "github", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.98"   # pinned with rust-toolchain.toml; GitHub macOS images lag rustup stable

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"               # NOT 0.8 — that's three majors stale; current is 1.x (Opus-audit-caught, F20). Starting stale means Dependabot opens a major-bump PR in week one against a brand-new ruleset, which is exactly the CI-thrash §0 rules out.
anyhow = "1"
git2 = { version = "0.21", features = ["https"] }
  # git2 0.21's own `default = []` (verified against its Cargo.toml this
  # session — NOT the "default features (ssh+https)" this comment used to
  # assume); `https` is what registers the https:// transport at all and
  # pulls in `cred` (§5b's `Cred::credential_helper`), and on macOS the
  # *TLS backend libgit2 actually compiles in* is Secure Transport, not
  # OpenSSL (libgit2-sys's build.rs selects GIT_OPENSSL only for non-Apple
  # unix targets, unconditionally on `target.contains("apple")` — verified
  # against its build.rs this session, unaffected by any openssl feature
  # flag). `ssh` deliberately left off: §0 locks `git_protocol=https`,
  # cloning goes through `gh repo clone`, and the credential path is `gh
  # auth git-credential` for `https://github.com` — nothing in this design
  # uses an ssh remote, so there's no reason to widen the license/link
  # surface for it.
  #
  # BUT: unlike git2's own optional openssl-sys dep (scoped to
  # `cfg(all(unix, not(target_os = "macos")))` in git2's Cargo.toml),
  # libgit2-sys's `https = ["openssl-sys"]` is NOT scoped away from macOS —
  # it requires openssl-sys on all `cfg(unix)` — because `openssl_init()`
  # (`#[cfg(all(unix, feature = "https"))] pub fn openssl_init() {
  # openssl_sys::init(); }` in libgit2-sys's lib.rs) calls it unconditionally
  # on every unix target regardless of which TLS backend is actually
  # compiled in. That's a real, observed macOS defect, not a theoretical
  # one: `otool -L target/debug/cw` showed the built binary dynamically
  # linked against `/opt/homebrew/opt/openssl@3/lib/{libssl,libcrypto}.3.dylib`
  # by absolute Homebrew path — despite Secure Transport doing the actual
  # TLS work — so the binary breaks the moment that install is upgraded,
  # relocated, or missing. Fixed below via a macOS-scoped `vendored`
  # openssl-sys, confirmed by re-running otool: Security.framework (Secure
  # Transport) is still linked, the Homebrew dylib path is gone. See §0 re:
  # vendored-openssl on Linux — that's a separate, still-unresolved
  # question (system-openssl-missing contingency); this macOS fix is
  # narrower and doesn't touch it.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
  # `crossterm` is ratatui's own backend-integration feature — it re-exports the exact
  # crossterm version ratatui was built against as `ratatui::crossterm`, so cw imports
  # `ratatui::crossterm::{event, execute, terminal}` everywhere instead of adding a second,
  # independently-versioned `crossterm` dependency (mismatched `KeyEvent`/`MouseEvent` types
  # across two crossterm majors don't unify). `default-features = false` drops `all-widgets`/
  # `widget-calendar` (extra widgets + a `time` dependency cw's Table-only UI never uses) —
  # the base `Table`/`Paragraph`/`Block` widgets this crate actually renders aren't gated
  # behind that feature.
frizbee = "0.13"
  # Fuzzy-match backend for the TUI's live filter box — skim's own matcher, verified usable
  # standalone via its docs.rs API (`Matcher::new`/`match_list` return pre-sorted, pre-
  # filtered `Match{score,index,exact}`), so the `nucleo-matcher` fallback noted in the design
  # wasn't needed.
ignore = "0.4"           # GitignoreBuilder for .worktreeinclude — same crate ripgrep uses, don't hand-roll
chrono = { version = "0.4", features = ["serde"] }
  # `features = ["serde"]` is required, not optional (Opus-audit-caught, F8) — RepoCache{fetched_at:
  # DateTime<Utc>, ..} is serde_json-serialized in §5k; DateTime only implements Serialize/Deserialize
  # behind this feature flag. Without it, cache.rs doesn't compile.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"  # persists a copy of the run's log to ~/.cache/cw/cw.log — see §5m
clap_complete = "4"      # `cw completions <shell>` — see §4
axoupdater = { version = "0.10", features = ["blocking", "github_releases"] }
  # Self-update check (selfupdate.rs) + apply (`u` in the dashboard), via
  # cargo-dist's own updater library. `blocking` gives synchronous entry
  # points (`is_update_needed_sync`/`run_sync`) so this codebase's plain-sync
  # `main` never needs its own tokio runtime — `blocking` pulls tokio in as
  # axoupdater's own internal, unexported dependency to back those two calls,
  # not ours to drive directly (confirmed against axoupdater 0.10.2's actual
  # source: no other method on `AxoUpdater` is both public and sync, so the
  # exact new-version number is never available synchronously — see
  # selfupdate.rs's `latest_release_tag` for how that gap is closed via `gh`,
  # already this codebase's own established GitHub-API path). `github_releases`
  # is axoupdater's own default feature anyway (kept explicit here per the
  # task); it's what resolves releases from this repo's own GitHub source
  # instead of axo.dev's hosted release service. Requires an install receipt
  # (`~/.config/cw/cw-receipt.json`, written only by cargo-dist's shell/
  # powershell installer) to do anything at all — a `cargo install --path .`
  # build has none, and every code path here degrades that to silence, never
  # an error.

[target.'cfg(target_os = "linux")'.dependencies]
# Vendored (not just a CI contingency anymore): a release binary that
# dynamically links whatever libssl the build runner happens to have would
# fail to run on any end-user distro with a different OpenSSL major (e.g.
# still on 1.1 while the runner has 3.x). Same rationale as the macOS block
# below. `openssl-sys` directly, not `git2 = {features=["vendored-openssl"]}`
# a second time in this table — Cargo unions feature flags across duplicate
# dependency entries, so either form works, but this is the more conventional
# way to express it (minor, F27).
openssl-sys = { version = "0.9", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Vendor (statically link) OpenSSL on macOS too — not for TLS (Secure
# Transport handles that, unaffected by this flag; see the git2 dependency
# comment above) but because libgit2-sys's `https` feature otherwise leaves
# an unused-but-required openssl-sys dynamically linked against Homebrew's
# `openssl@3` by absolute path, which breaks on any Mac where that install
# differs or is missing. Same crate/feature/rationale as the Linux
# contingency above, different trigger.
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
