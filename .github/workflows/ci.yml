name: CI

# Event-driven. pull_request → validate. push to main → cache + tag.
# push of v*.*.* → dist-build → publish → verify.
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  DIST_VERSION: "0.32.0"

jobs:
  # ------------------------------------------------------------------
  # Validate (pull_request, push to main, workflow_dispatch — not tags)
  # ------------------------------------------------------------------
  lint:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-21 (no version tags on this repo)
        with: { toolchain: "1.98", components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "1.98"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  workflows:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: this directory contains exactly one workflow
        run: |
          set -euo pipefail
          n=$(find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected exactly one file in .github/workflows, found $n"
            find .github/workflows -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' \) -print
            exit 1
          fi
          if ! grep -qE '^on:' .github/workflows/ci.yml; then
            echo "::error file=.github/workflows/ci.yml::missing top-level on:"
            exit 1
          fi

  secrets:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --no-banner --redact

  dist-plan:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - run: dist plan

  build-test:
    name: build-test (${{ matrix.os }})
    needs: [lint]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-21 (no version tags on this repo)
        with: { toolchain: "1.98", components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "1.98"
          save-if: false
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
      - if: matrix.os == 'ubuntu-latest'
        run: cargo build --release --locked
      - if: matrix.os == 'ubuntu-latest'
        run: ./target/release/cw --version

  # ------------------------------------------------------------------
  # Tag (push to main only). PAT so the tag push retriggers this workflow.
  # ------------------------------------------------------------------
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-21 (no version tags on this repo)
        with: { toolchain: "1.98" }
      - uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  bump:
    needs: [tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-21 (no version tags on this repo)
        with: { toolchain: "1.98" }
      - id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - if: fromJSON(steps.release-plz.outputs.pr).number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: gh pr merge --squash --auto "${{ fromJSON(steps.release-plz.outputs.pr).number }}" --repo "${{ github.repository }}"

  # ------------------------------------------------------------------
  # Publish (version tags only). Native linux + Apple Silicon.
  # ------------------------------------------------------------------
  dist-build:
    name: dist-build (${{ matrix.target }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update 1.98 --no-self-update && rustup default 1.98
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Build
        id: dist
        run: |
          dist build --tag="${{ github.ref_name }}" --print=linkage --output-format=json --artifacts=local --target="${{ matrix.target }}" > dist-manifest.json
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          mkdir -p target/distrib
          cp dist-manifest.json "target/distrib/${{ matrix.target }}-dist-manifest.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "target/distrib/*${{ matrix.target }}*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: |
            ${{ steps.dist.outputs.paths }}
            target/distrib/${{ matrix.target }}-dist-manifest.json

  dist-global:
    needs: [dist-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update 1.98 --no-self-update && rustup default 1.98
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: dist
        run: |
          dist build --tag="${{ github.ref_name }}" --output-format=json --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          mkdir -p target/distrib
          cp dist-manifest.json target/distrib/global-dist-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.dist.outputs.paths }}
            target/distrib/global-dist-manifest.json

  publish:
    needs: [dist-global]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update 1.98 --no-self-update && rustup default 1.98
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${DIST_VERSION}/cargo-dist-installer.sh" | sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        run: |
          dist host --tag="${{ github.ref_name }}" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - run: rm -f artifacts/*-dist-manifest.json
      - env:
          PRERELEASE_FLAG: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
        run: |
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          gh release create "${{ github.ref_name }}" --target "${{ github.sha }}" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  verify:
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      ASSET: cw-${{ matrix.target }}.tar.xz
    steps:
      - run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$ASSET" --pattern "$ASSET.sha256"
      - run: shasum -a 256 -c "$ASSET.sha256"
      - run: gh attestation verify "$ASSET" --repo "${{ github.repository }}"
      - run: tar -xJf "$ASSET"
      - run: |
          bin="cw-${{ matrix.target }}/cw"
          chmod +x "$bin"
          actual_output="$("$bin" --version)"
          expected_version="${TAG#v}"
          actual_version="$(printf '%s' "$actual_output" | awk '{print $2}')"
          echo "binary printed: $actual_output"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::version mismatch: binary reports '$actual_version', tag is '$TAG'"
            exit 1
          fi
      - if: failure()
        run: |
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft
          exit 1
