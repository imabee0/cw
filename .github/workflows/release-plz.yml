name: release-plz

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read   # default-deny baseline; nothing at the workflow level needs more

jobs:
  # Tags + publishes a release once Cargo.toml's version has no matching tag
  # yet (i.e. once the release-pr job's version-bump PR has merged). Must
  # never also create a GitHub Release -- release.yml's cargo-dist host job
  # does that; release-plz only tags (release-plz.toml: git_release_enable
  # = false).
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # read, not write: `release` only tags/pushes with
      # git_release_enable=false; it never opens or edits a PR, unlike
      # release-pr below (matches release-plz.dev's own quickstart example).
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-21 (no version tags on this repo)
        with: { toolchain: stable }
      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          # release-plz's own git-token flag reads $GITHUB_TOKEN from the
          # step environment (see release-plz/action's action.yml) -- there
          # is no `with: token:` input for this. The elevated PAT must land
          # here, not on actions/checkout, so the tag push it makes is
          # attributed to a real user and re-triggers workflows (the default
          # GITHUB_TOKEN cannot, by GitHub's anti-recursion rule).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # Opens or updates the version-bump PR from unreleased conventional
  # commits, then arms auto-merge on it so it lands itself once CI passes.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, resolved 2026-08-21 (no version tags on this repo)
        with: { toolchain: stable }
      - name: Run release-plz release-pr
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          # Same reasoning as the release job: without the PAT here, the PR
          # release-plz opens would carry zero CI checks (GITHUB_TOKEN-authored
          # PRs don't trigger `on: pull_request`), so the auto-merge step below
          # would wait forever.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Arm auto-merge on the release PR
        if: fromJSON(steps.release-plz.outputs.pr).number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          gh pr merge --squash --auto "${{ fromJSON(steps.release-plz.outputs.pr).number }}" --repo "${{ github.repository }}"
