# Injected into dist-generated release.yml local-artifact jobs
# (`dist.github-build-setup`). Lives in `.github/`, not `.github/workflows/`,
# because GitHub runs every `*.yml` in workflows/ as a standalone workflow.
# GitHub macOS images ship a rustup `stable` months behind (1.96 vs
# rust-version 1.98). rust-toolchain.toml channel = "stable" selects the
# installed toolchain and does not update it.
- name: rustup update stable
  run: rustup update stable --no-self-update && rustup default stable
