[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# GitHub Actions lives in `.github/workflows/ci.yml` (one workflow).
# Dist builds artifacts; it does not generate a second workflow.
installers = ["shell"]
# Unix-only (/dev/tty, chmod +x). Intel macOS dropped: GitHub's x86_64
# macOS runner pool is gone. Apple Silicon + Linux x86_64.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
install-path = "CARGO_HOME"
hosting = "github"
# release-plz tags; this workflow's `publish` job creates the GitHub Release.
install-updater = true
github-attestations = true
