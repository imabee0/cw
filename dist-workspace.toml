[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
# Windows and Linux-arm64 deliberately excluded: cw has no Windows support
# (skim/hooks/logging all assume Unix — /dev/tty, chmod +x, unix file modes)
# and no known arm64 Linux users yet; cheap to add later since dist uses
# native arm64 Linux runners, not cross-compilation.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Skip running on pull_request — the generated workflow grants contents:write
# at the workflow level, which every job (including a PR-triggered plan job)
# would inherit for no reason, contradicting ci.yml's least-privilege
# contents:read convention. The tag-vs-Cargo.toml-version check still runs
# the moment a real tag is pushed.
pr-run-mode = "skip"
# Sign release artifacts via GitHub attestations (the "sign" half of house
# policy; verify with `gh attestation verify <artifact> --repo imabee0/cw`).
github-attestations = true
