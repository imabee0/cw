[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax).
# Windows, Linux-arm64, and Intel macOS are excluded: cw is Unix-only
# (/dev/tty, chmod +x), and GitHub's x86_64 macOS runner pool is gone —
# aarch64-apple-darwin is the macOS artifact.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Pin the rustup toolchain cargo-dist installs in release.yml. GitHub
# macOS images ship an older `stable` than Cargo.toml rust-version;
# rust-toolchain.toml channel = "1.98" alone is not enough if cargo is
# not a rustup proxy. Deprecated dist key, still the generated-CI hook.
rust-toolchain-version = "1.98"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
# true: the release-plz.yml/release-verify.yml chain (release-plz.toml)
# makes releases frequent and automatic, so the shell installer bundles a
# `cw-update` binary letting existing installs self-update instead of
# re-running the install script by hand each time.
install-updater = true
# Skip running on pull_request — the generated workflow grants contents:write
# at the workflow level, which every job (including a PR-triggered plan job)
# would inherit for no reason, contradicting ci.yml's least-privilege
# contents:read convention. The tag-vs-Cargo.toml-version check still runs
# the moment a real tag is pushed.
pr-run-mode = "skip"
# Sign release artifacts via GitHub attestations (the "sign" half of house
# policy; verify with `gh attestation verify <artifact> --repo imabee0/cw`).
github-attestations = true
