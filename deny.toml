[advisories]
ignore = []

[licenses]
# Exactly the licenses the current dependency tree uses (an OR expression is
# satisfied by any one allowed alternative). A new dependency under any other
# license fails `cargo deny check` until it is reviewed and added here.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
# This workspace's own unpublished crates (cw, and the hakari-generated
# workspace-hack, whose manifest must not be hand-edited to add a license).
private = { ignore = true }

[bans]
multiple-versions = "warn"
