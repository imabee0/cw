[advisories]
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
# CDLA-Permissive-2.0: `webpki-root-certs`, the Mozilla root-certificate
# bundle pulled in transitively via axoupdater -> reqwest ->
# rustls-platform-verifier — a data license (root cert data, not code), no
# copyleft, permissive in the same spirit as the rest of this list.

[bans]
multiple-versions = "warn"
